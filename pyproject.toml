[project]
name = "mlops2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "evidently==0.7.21",
    "gradio==6.26.0",
    "imbalanced-learn==0.14.2",
    "joblib==1.5.3",
    "jupyterlab>=4.6.3",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "psycopg[binary]>=3.3.5",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["modele"]
omit = [
    "modele/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"
