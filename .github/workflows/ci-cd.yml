name: CI/CD - Tests, Docker Build et Deploy Render

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Tests unitaires Python
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Mettre pip à jour
        run: python -m pip install --upgrade pip

      - name: Installer les dépendances applicatives
        run: python -m pip install -r requirements.txt

      - name: Installer les dépendances de développement
        run: python -m pip install -r requirements-dev.txt

      - name: Exécuter les tests unitaires
        run: pytest -q


  docker-build:
    name: Construire l'image Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: credit-scoring-gradio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy-render:
    name: Déployer sur Render
    runs-on: ubuntu-latest
    needs:
      - test
      - docker-build

    # Déploiement uniquement si :
    # - les jobs précédents ont réussi,
    # - le push est sur main,
    # - ce n'est pas une pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Déclencher le déploiement Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK"